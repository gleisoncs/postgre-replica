[databases]
; writes -> primary
app_rw = host=primary port=5432 dbname=postgres
; reads -> replicas, round-robin across hosts
app_ro = host=replica1,replica2 port=5432 dbname=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 20
max_client_conn = 500
admin_users = postgres
ignore_startup_parameters = extra_float_digits
